name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project correctly
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name '*.zip' -exec rm -rf {} +
          unzip -o NaotEilitZmanim-project.zip -d temp_unzip
          if [ -d "temp_unzip/app" ]; then
            cp -r temp_unzip/* .
          else
            FOLDER_NAME=$(ls temp_unzip)
            cp -r temp_unzip/$FOLDER_NAME/* .
          fi
          rm -rf temp_unzip

      - name: Add Network Security Permissions Only
        run: |
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python3 -c "
          import re
          manifest_path = 'app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'
          if 'android.permission.INTERNET' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + permissions, content)

          if 'networkSecurityConfig' not in content:
              content = re.sub(r'(<application)', r'\1 android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\"', content)

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
