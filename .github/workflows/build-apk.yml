name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o NaotEilitZmanim-project.zip -d extracted
          cp -r extracted/NaotEilitZmanim/* .
          rm -rf extracted

      - name: Fix Network Security and Manifest Permissions
        run: |
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python3 -c "
          import re
          manifest_path = 'app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'
          if 'android.permission.INTERNET' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + permissions, content)

          if 'networkSecurityConfig' not in content:
              content = re.sub(r'(<application)', r'\1 android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\"', content)

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Fix NedarimPlusApi URL and Endpoint
        run: |
          cat << 'EOF' > app/src/main/java/com/naoteilit/zmanim/data/NedarimPlusApi.kt
          package com.naoteilit.zmanim.data

          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.scalars.ScalarsConverterFactory
          import retrofit2.http.GET
          import retrofit2.http.Query
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import java.util.concurrent.TimeUnit
          import javax.net.ssl.*

          interface NedarimPlusApiService {
              @GET("nedarimplus/Zmanim/GetMinyanim.aspx")
              suspend fun getMinyanim(
                  @Query("lat") lat: String = "31.931201713080377",
                  @Query("lng") lng: String = "35.04763733760363",
                  @Query("radius") radius: String = "1"
              ): String
          }

          object NedarimPlusApi {
              private val unsafeOkHttpClient: OkHttpClient
                  get() {
                      try {
                          val trustAllCerts = arrayOf<TrustManager>(object : X509TrustManager {
                              override fun checkClientTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                              override fun checkServerTrusted(chain: Array<out X509Certificate>?, authType: String?) {}
                              override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
                          })

                          val sslContext = SSLContext.getInstance("SSL")
                          sslContext.init(null, trustAllCerts, SecureRandom())
                          val sslSocketFactory = sslContext.socketFactory

                          return OkHttpClient.Builder()
                              .sslSocketFactory(sslSocketFactory, trustAllCerts[0] as X509TrustManager)
                              .hostnameVerifier { _, _ -> true }
                              .connectTimeout(30, TimeUnit.SECONDS)
                              .readTimeout(30, TimeUnit.SECONDS)
                              .build()
                      } catch (e: Exception) {
                          return OkHttpClient.Builder().build()
                      }
                  }

              val service: NedarimPlusApiService by lazy {
                  Retrofit.Builder()
                      .baseUrl("https://www.matara.pro/")
                      .client(unsafeOkHttpClient)
                      .addConverterFactory(ScalarsConverterFactory.create())
                      .build()
                      .create(NedarimPlusApiService::class.java)
              }
          }
          EOF

      - name: Fix Theme.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/naoteilit/zmanim/ui/theme/Theme.kt
          package com.naoteilit.zmanim.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.dynamicDarkColorScheme
          import androidx.compose.material3.dynamicLightColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFFD4AF37),
              secondary = Color(0xFF1B2A4A),
              background = Color(0xFF121212),
              surface = Color(0xFF1E1E1E),
              onPrimary = Color.Black,
              onSecondary = Color.White
          )

          private val LightColorScheme = lightColorScheme(
              primary = Color(0xFF1B2A4A),
              secondary = Color(0xFFD4AF37),
              background = Color(0xFFF9F9FB),
              surface = Color(0xFFFFFFFF)
          )

          @Composable
          fun NaotEilitZmanimTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = false,
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (darkTheme) DarkColorScheme else LightColorScheme
              MaterialTheme(colorScheme = colorScheme, typography = Typography(), content = content)
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
