name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o NaotEilitZmanim-project.zip -d extracted
          cp -r extracted/NaotEilitZmanim/* .
          rm -rf extracted

      - name: Fix Theme.kt Completely
        run: |
          cat << 'EOF' > app/src/main/java/com/naoteilit/zmanim/ui/theme/Theme.kt
          package com.naoteilit.zmanim.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.dynamicDarkColorScheme
          import androidx.compose.material3.dynamicLightColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext

          private val PrimaryDark = Color(0xFFD4AF37)
          private val SecondaryDark = Color(0xFF1B2A4A)
          private val PrimaryLight = Color(0xFF1B2A4A)
          private val SecondaryLight = Color(0xFFD4AF37)

          private val DarkColorScheme = darkColorScheme(
              primary = PrimaryDark,
              secondary = SecondaryDark,
              background = Color(0xFF121212),
              surface = Color(0xFF1E1E1E),
              onPrimary = Color.Black,
              onSecondary = Color.White,
              onBackground = Color.White,
              onSurface = Color.White
          )

          private val LightColorScheme = lightColorScheme(
              primary = PrimaryLight,
              secondary = SecondaryLight,
              background = Color(0xFFF9F9FB),
              surface = Color(0xFFFFFFFF),
              onPrimary = Color.White,
              onSecondary = Color.Black,
              onBackground = Color(0xFF1C1B1F),
              onSurface = Color(0xFF1C1B1F)
          )

          @Composable
          fun NaotEilitZmanimTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              dynamicColor: Boolean = false,
              content: @Composable () -> Unit
          ) {
              val colorScheme = when {
                  dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> {
                      val context = LocalContext.current
                      if (darkTheme) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
                  }
                  darkTheme -> DarkColorScheme
                  else -> LightColorScheme
              }

              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = Typography(),
                  content = content
              )
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
